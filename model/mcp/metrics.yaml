file_format: definition/2
attribute_groups:
  - id: mcp.operation.metrics.attributes
    visibility: internal
    attributes:
      - ref_group: mcp.common.attributes
      - ref: mcp.resource.uri
        requirement_level: opt_in

  - id: mcp.session.metrics.attributes
    visibility: internal
    attributes:
      - ref: mcp.protocol.version
      - ref: network.protocol.name
        requirement_level:
          recommended: When applicable.
        examples:
          - "http"
          - "websocket"
      - ref: jsonrpc.protocol.version
        requirement_level:
          recommended: When it's not `2.0`.
      - ref: error.type
        requirement_level:
          conditionally_required: If and only if session ends with an error.

metrics:
  - name: mcp.client.operation.duration
    requirement_level: recommended
    instrument: histogram
    unit: s
    brief: >
      The duration of the MCP request or notification as observed on the sender
      from the time it was sent until the response or ack is received.
    stability: development
    attributes:
      - ref_group: mcp.operation.metrics.attributes
      - ref_group: mcp.client.status.attributes
      - ref_group: mcp.client.address_and_port.attributes

  - name: mcp.server.operation.duration
    requirement_level: recommended
    instrument: histogram
    unit: s
    brief: >
      MCP request or notification duration as observed on the receiver
      from the time it was received until the result or ack is sent.
    stability: development
    attributes:
      - ref_group: mcp.operation.metrics.attributes
      - ref_group: mcp.server.status.attributes

  - name: mcp.client.session.duration
    requirement_level: recommended
    instrument: histogram
    unit: s
    brief: The duration of the MCP session as observed on the MCP client.
    stability: development
    attributes:
      - ref_group: mcp.session.metrics.attributes
      - ref_group: mcp.client.address_and_port.attributes

  - name: mcp.server.session.duration
    requirement_level: recommended
    instrument: histogram
    unit: s
    brief: The duration of the MCP session as observed on the MCP server.
    stability: development
    attributes:
      - ref_group: mcp.session.metrics.attributes

  - name: mcp.client.operation.active
    requirement_level: opt_in
    instrument: updowncounter
    unit: "{operation}"
    brief: >
      The number of MCP requests and notifications in progress as observed on the sender.
    note: |
      An operation is in progress from the time the request or notification is sent
      until the response or ack is received, which is the interval measured by
      `mcp.client.operation.duration`. A notification that is not acknowledged, such
      as one sent over stdio, ends once it is sent. A request that is cancelled, times
      out, or is still pending when the connection closes ends at that point.

      The counter SHOULD be incremented and decremented with the same attributes,
      which are the ones known when the operation starts.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: mcp.request.attributes
      - ref_group: mcp.client.address_and_port.attributes

  - name: mcp.server.operation.active
    requirement_level: opt_in
    instrument: updowncounter
    unit: "{operation}"
    brief: >
      The number of MCP requests and notifications in progress as observed on the receiver.
    note: |
      An operation is in progress from the time the request or notification is received
      until the result or ack is sent, which is the interval measured by
      `mcp.server.operation.duration`. A request that is cancelled, or is still pending
      when the connection closes, ends at that point. A notification that is not
      acknowledged, such as one received over stdio, ends when the receiver finishes
      processing it. Instrumentation that cannot observe when processing finishes
      SHOULD NOT count such notifications.

      The counter SHOULD be incremented and decremented with the same attributes,
      which are the ones known when the operation starts.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: mcp.request.attributes

  - name: mcp.client.request.size
    requirement_level: opt_in
    instrument: histogram
    unit: By
    brief: The size of the MCP request or notification as observed on the sender.
    note: |
      The size, in bytes, of the UTF-8 encoded JSON-RPC request or notification
      message as serialized by the sender, excluding transport framing such as HTTP
      headers, server-sent event fields, or stdio message delimiters. When the
      transport compresses the message, the uncompressed size SHOULD be recorded.

      This metric SHOULD be recorded when the operation ends, with the same
      attributes as `mcp.client.operation.duration`.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: mcp.operation.metrics.attributes
      - ref_group: mcp.client.status.attributes
      - ref_group: mcp.client.address_and_port.attributes

  - name: mcp.client.response.size
    requirement_level: opt_in
    instrument: histogram
    unit: By
    brief: The size of the MCP response as observed on the sender.
    note: |
      The size, in bytes, of the UTF-8 encoded JSON-RPC response message (result or
      error) received for the request, excluding transport framing such as HTTP
      headers, server-sent event fields, or stdio message delimiters. When the
      transport compresses the message, the uncompressed size SHOULD be recorded.
      Instrumentation that does not have access to the received bytes MAY record the
      size of the message re-serialized as compact JSON. Other messages received
      while the request is in progress, such as progress notifications, are not
      included.

      This metric SHOULD NOT be recorded for notifications or when no response
      is received.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: mcp.operation.metrics.attributes
      - ref_group: mcp.client.status.attributes
      - ref_group: mcp.client.address_and_port.attributes

  - name: mcp.server.request.size
    requirement_level: opt_in
    instrument: histogram
    unit: By
    brief: The size of the MCP request or notification as observed on the receiver.
    note: |
      The size, in bytes, of the UTF-8 encoded JSON-RPC request or notification
      message as received, excluding transport framing such as HTTP headers,
      server-sent event fields, or stdio message delimiters. When the transport
      compresses the message, the uncompressed size SHOULD be recorded.
      Instrumentation that does not have access to the received bytes MAY record the
      size of the message re-serialized as compact JSON.

      This metric SHOULD be recorded when the operation ends, with the same
      attributes as `mcp.server.operation.duration`.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: mcp.operation.metrics.attributes
      - ref_group: mcp.server.status.attributes

  - name: mcp.server.response.size
    requirement_level: opt_in
    instrument: histogram
    unit: By
    brief: The size of the MCP response as observed on the receiver.
    note: |
      The size, in bytes, of the UTF-8 encoded JSON-RPC response message (result or
      error) sent for the request, excluding transport framing such as HTTP headers,
      server-sent event fields, or stdio message delimiters. When the transport
      compresses the message, the uncompressed size SHOULD be recorded. Other
      messages sent while the request is in progress, such as progress
      notifications, are not included.

      This metric SHOULD NOT be recorded for notifications.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: mcp.operation.metrics.attributes
      - ref_group: mcp.server.status.attributes
