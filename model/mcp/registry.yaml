file_format: definition/2
attributes:
  - key: mcp.method.name
    type:
      members:
        - id: notifications_cancelled
          value: notifications/cancelled
          brief: >
            Notification cancelling a previously-issued request.
          stability: development
        - id: initialize
          value: initialize
          brief: >
            Request to initialize the MCP client.
          stability: development
          deprecated:
            reason: obsoleted
            note: >
              Removed from the wire schema as of the 2026-07-28 MCP protocol
              revision, which eliminates the connection-scoped session and
              replaces the `initialize` handshake with a stateless,
              capabilities-per-request model. See the
              [Backward Compatibility](https://modelcontextprotocol.io/specification/2026-07-28/basic/transports#backward-compatibility)
              section of the transports spec. Retained here only for peers
              still interoperating with pre-2026-07-28 revisions.
        - id: notifications_initialized
          value: notifications/initialized
          brief: >
            Notification indicating that the MCP client has been initialized.
          stability: development
          deprecated:
            reason: obsoleted
            note: >
              Removed alongside `initialize` as of the 2026-07-28 MCP
              protocol revision; see that member's note.
        - id: notifications_progress
          value: notifications/progress
          brief: >
            Notification indicating the progress for a long-running operation.
          stability: development
        - id: ping
          value: ping
          brief: >
            Request to check that the other party is still alive.
          stability: development
          deprecated:
            reason: obsoleted
            note: >
              Not present in the 2026-07-28 MCP protocol revision's wire
              schema. Retained here only for peers still interoperating
              with pre-2026-07-28 revisions.
        - id: resources_list
          value: resources/list
          brief: >
            Request to list resources available on server.
          stability: development
        - id: resources_templates_list
          value: resources/templates/list
          brief: >
            Request to list resource templates available on server.
          stability: development
        - id: resources_read
          value: resources/read
          brief: >
            Request to read a resource.
          stability: development
        - id: notifications_resources_list_changed
          value: notifications/resources/list_changed
          brief: >
            Notification indicating that the list of resources has changed.
          stability: development
        - id: resources_subscribe
          value: resources/subscribe
          brief: >
            Request to subscribe to a resource.
          stability: development
          deprecated:
            reason: renamed
            renamed_to: subscriptions_listen
            note: >
              Replaced by `subscriptions/listen` as of the 2026-07-28 MCP
              protocol revision, which generalizes per-resource
              subscribe/unsubscribe into a single long-lived subscription
              channel. Retained here only for peers still interoperating
              with pre-2026-07-28 revisions.
        - id: resources_unsubscribe
          value: resources/unsubscribe
          brief: >
            Request to unsubscribe from resource updates.
          stability: development
          deprecated:
            reason: obsoleted
            note: >
              Superseded by the `subscriptions/listen` channel model as of
              the 2026-07-28 MCP protocol revision; see `resources_subscribe`.
              Unlike `resources/subscribe`, unsubscription has no direct
              1:1 replacement method (it is a client-side channel close),
              so this is marked obsoleted rather than renamed.
        - id: notifications_resources_updated
          value: notifications/resources/updated
          brief: >
            Notification indicating that a resource has been updated.
          stability: development
        - id: prompts_list
          value: prompts/list
          brief: >
            Request to list prompts available on server.
          stability: development
        - id: prompts_get
          value: prompts/get
          brief: >
            Request to get a prompt.
          stability: development
        - id: notifications_prompts_list_changed
          value: notifications/prompts/list_changed
          brief: >
            Notification indicating that the list of prompts has changed.
          stability: development
        - id: tools_list
          value: tools/list
          brief: >
            Request to list tools available on server.
          stability: development
        - id: tools_call
          value: tools/call
          brief: >
            Request to call a tool.
          stability: development
        - id: notifications_tools_list_changed
          value: notifications/tools/list_changed
          brief: >
            Notification indicating that the list of tools has changed.
          stability: development
        - id: logging_set_level
          value: logging/setLevel
          brief: >
            Request to set the logging level.
          stability: development
          deprecated:
            reason: obsoleted
            note: >
              Removed as of the 2026-07-28 MCP protocol revision per
              [SEP-2577](https://modelcontextprotocol.io/seps/2577-deprecate-roots-sampling-and-logging),
              which names OpenTelemetry as the correct alternative to an
              application-protocol logging channel. Replaced by the
              `io.modelcontextprotocol/logLevel` request-meta field.
        - id: notifications_message
          value: notifications/message
          brief: >
            Notification indicating that a message has been received.
          stability: development
        - id: sampling_create_message
          value: sampling/createMessage
          brief: >
            Request to create a sampling message.
          stability: development
          deprecated:
            reason: uncategorized
            note: >
              Deprecated as of the 2026-07-28 MCP protocol revision per
              [SEP-2577](https://modelcontextprotocol.io/seps/2577-deprecate-roots-sampling-and-logging).
              Still present in the wire schema for backward compatibility;
              new clients/servers should not rely on it.
        - id: completion_complete
          value: completion/complete
          brief: >
            Request to complete a prompt.
          stability: development
        - id: roots_list
          value: roots/list
          brief: >
            Request to list roots available on server.
          stability: development
          deprecated:
            reason: uncategorized
            note: >
              Deprecated as of the 2026-07-28 MCP protocol revision per
              [SEP-2577](https://modelcontextprotocol.io/seps/2577-deprecate-roots-sampling-and-logging).
              Still present in the wire schema for backward compatibility;
              new clients/servers should not rely on it.
        - id: notifications_roots_list_changed
          value: notifications/roots/list_changed
          brief: >
            Notification indicating that the list of roots has changed.
          stability: development
          deprecated:
            reason: uncategorized
            note: >
              Deprecated alongside `roots/list` as of the 2026-07-28 MCP
              protocol revision per
              [SEP-2577](https://modelcontextprotocol.io/seps/2577-deprecate-roots-sampling-and-logging).
        - id: elicitation_create
          value: elicitation/create
          brief: >
            Request from the server to elicit additional information from the
            user via the client
          stability: development
        - id: server_discover
          value: server/discover
          brief: >
            Request used by a client to discover server metadata as part of
            the Multi Round-Trip Request (MRTR) flow introduced in the
            2026-07-28 protocol revision.
          stability: development
        - id: subscriptions_listen
          value: subscriptions/listen
          brief: >
            Request to open a long-lived subscription channel, introduced in
            the 2026-07-28 protocol revision.
          stability: development
        - id: notifications_subscriptions_acknowledged
          value: notifications/subscriptions/acknowledged
          brief: >
            Notification acknowledging a subscription request, introduced in
            the 2026-07-28 protocol revision.
          stability: development
    brief: The name of the request or notification method.
    stability: development
  - key: mcp.session.id
    type: string
    brief: >
      Identifies the connection-scoped session carried by an
      `Mcp-Session-Id` header, when one is present.
    note: >
      The 2026-07-28 MCP protocol revision removes protocol-level sessions
      and the `initialize` handshake in favor of a stateless,
      capabilities-per-request model — see the
      [Backward Compatibility](https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#backward-compatibility)
      section of the Streamable HTTP transport spec. This attribute now
      applies only when a peer is interoperating with a pre-2026-07-28
      revision that still assigns an `Mcp-Session-Id`; it MUST NOT be set
      for a 2026-07-28-and-later session, since none exists to identify.
    examples: ["191c4850af6c49e08843a3f6c80e5046"]
    stability: development
  - key: mcp.resource.uri
    type: string
    brief: The value of the resource uri.
    note: >
      This is a URI of the resource provided in the following requests or notifications:
      `resources/read`, `resources/subscribe`, `resources/unsubscribe`, or `notifications/resources/updated`.
    examples: ["postgres://database/customers/schema", "file:///home/user/documents/report.pdf"]
    stability: development
  - key: mcp.protocol.version
    type: string
    brief: The [version](https://modelcontextprotocol.io/specification/versioning) of the Model Context Protocol used.
    examples: ["2026-07-28"]
    stability: development
