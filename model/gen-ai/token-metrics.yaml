file_format: definition/2
metrics:
  - name: gen_ai.client.inference.usage.input_tokens
    requirement_level: recommended
    instrument: counter
    unit: "{token}"
    brief: 'The number of input (prompt) tokens used, including cached tokens.'
    note: &inference_usage_note >
      This metric SHOULD be reported for non-realtime client inference operations
      (`chat`, `generate_content`, `text_completion`) when the operation involves
      the usage of tokens and the count is readily available, and SHOULD NOT be
      reported for `realtime_inference` or other operations.

      When systems report both used tokens and billable tokens, instrumentation
      MUST report billable tokens.

      See `gen_ai.token.modality` attribute for how to split tokens by modality.

      Instrumentation SHOULD record contributions from successful and failed
      inference operations. Each measurement MUST be a known, strictly positive
      modality contribution.

      When a contribution's modality cannot reliably be determined,
      instrumentation MUST set `gen_ai.token.modality` to `unknown`.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.gen_ai.inference
      - ref: gen_ai.token.modality
        requirement_level: required
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.client.inference.usage.output_tokens
    requirement_level: recommended
    instrument: counter
    unit: "{token}"
    brief: 'The number of output (completion) tokens used, including reasoning tokens.'
    note: *inference_usage_note
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.gen_ai.inference
      - ref: gen_ai.token.modality
        requirement_level: required
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.client.inference.usage.cache_read.input_tokens
    requirement_level: recommended
    instrument: counter
    unit: "{token}"
    brief: 'The number of input tokens served from a provider-managed cache.'
    note: >
      Applies only to non-realtime client inference operations (`chat`,
      `generate_content`, `text_completion`) and SHOULD NOT be reported for
      `realtime_inference` or other operations.

      This value is a subset of `gen_ai.client.inference.usage.input_tokens`.

      Instrumentation SHOULD record contributions from successful and failed
      inference operations. Each measurement MUST be a known, strictly positive
      modality contribution.

      When a contribution's modality cannot reliably be determined,
      instrumentation MUST set `gen_ai.token.modality` to `unknown`.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.gen_ai.inference
      - ref: gen_ai.token.modality
        requirement_level: required
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.client.inference.usage.cache_write.input_tokens
    requirement_level: recommended
    instrument: counter
    unit: "{token}"
    brief: 'The number of input tokens written to a provider-managed cache.'
    note: >
      Applies only to non-realtime client inference operations (`chat`,
      `generate_content`, `text_completion`) and SHOULD NOT be reported for
      `realtime_inference` or other operations.

      This value is a subset of `gen_ai.client.inference.usage.input_tokens`.

      Instrumentation SHOULD record contributions from successful and failed
      inference operations. Each measurement MUST be a known, strictly positive
      modality contribution.

      When a contribution's modality cannot reliably be determined,
      instrumentation MUST set `gen_ai.token.modality` to `unknown`.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.gen_ai.inference
      - ref: gen_ai.token.modality
        requirement_level: required
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.client.inference.usage.reasoning.output_tokens
    requirement_level: recommended
    instrument: counter
    unit: "{token}"
    brief: 'The number of output tokens used for reasoning (e.g. chain-of-thought, extended thinking).'
    note: >
      Applies only to non-realtime client inference operations (`chat`,
      `generate_content`, `text_completion`) and SHOULD NOT be reported for
      `realtime_inference` or other operations.

      This value is a subset of `gen_ai.client.inference.usage.output_tokens`.

      Instrumentation SHOULD record contributions from successful and failed
      inference operations. Each measurement MUST be a known, strictly positive
      reasoning token count.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.gen_ai.inference
      - ref_group: attributes.gen_ai.error

  - name: gen_ai.client.inference.operation.input_tokens
    requirement_level: recommended
    instrument: histogram
    unit: "{token}"
    brief: 'The number of input (prompt) tokens used per inference operation.'
    note: &token_usage_note >
      This metric SHOULD be reported for non-realtime client inference operations
      (`chat`, `generate_content`, `text_completion`) when the operation involves
      the usage of tokens and the count is readily available, and SHOULD NOT be
      reported for `realtime_inference` or other operations.

      For example, if GenAI system returns usage information in the streaming response,
      it SHOULD be used. Or if GenAI system returns each token independently,
      instrumentation SHOULD count number of output tokens and record the result.

      If instrumentation cannot efficiently obtain number of input and/or output tokens,
      it MAY allow users to enable offline token counting. Otherwise it MUST NOT report usage metrics.

      When systems report both used tokens and billable tokens, instrumentation MUST report billable tokens.

      Instrumentations SHOULD record this metric for each inference operation,
      including failed ones. The recorded value SHOULD match the token count
      returned by the provider, or `0` if the response was not received or
      did not contain token usage.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.gen_ai.inference
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.client.inference.operation.output_tokens
    requirement_level: recommended
    instrument: histogram
    unit: "{token}"
    brief: 'The number of output (completion) tokens used per inference operation.'
    note: *token_usage_note
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.gen_ai.inference
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.client.embeddings.operation.input_tokens
    requirement_level: recommended
    instrument: histogram
    unit: "{token}"
    brief: 'The number of input tokens used per embeddings operation.'
    note: >
      This metric SHOULD be reported when the count is readily available.

      When systems report both used tokens and billable tokens, instrumentation MUST report billable tokens.

      Instrumentations SHOULD record this metric for each embeddings operation,
      including failed ones. The recorded value SHOULD match the token count
      returned by the provider, or `0` if the response was not received or
      did not contain token usage.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: attributes.gen_ai.embeddings
      - ref_group: attributes.gen_ai.address_and_port
      - ref_group: attributes.gen_ai.error
metric_refinements:
  - id: openai.gen_ai.client.inference.usage.input_tokens
    ref: gen_ai.client.inference.usage.input_tokens
    brief: >
      OpenAI-specific extension to `gen_ai.client.inference.usage.input_tokens`. Adds
      `openai.response.system_fingerprint` when the provider is `openai`.
    stability: development
    attributes:
      - ref_group: metric_attributes.openai
  - id: openai.gen_ai.client.inference.usage.output_tokens
    ref: gen_ai.client.inference.usage.output_tokens
    brief: >
