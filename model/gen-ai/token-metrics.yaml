    brief: >
      OpenAI-specific extension to `gen_ai.client.inference.usage.reasoning.output_tokens`. Adds
      `openai.response.service_tier` and `openai.response.system_fingerprint`
      when the provider is `openai`.
    stability: development
    attributes:
      - ref_group: metric_attributes.openai
  - id: openai.gen_ai.client.inference.operation.input_tokens
