file_format: definition/2
attribute_groups:
  - id: metric_attributes.gen_ai
    visibility: internal
    attributes:
      - ref_group: attributes.gen_ai.address_and_port
      - ref_group: attributes.gen_ai.common
      - ref: gen_ai.response.model
        requirement_level: recommended
      - ref: gen_ai.provider.name
        requirement_level: required

  - id: metric_attributes.openai
    visibility: internal
    attributes:
      - ref: openai.response.service_tier
        requirement_level: recommended
      - ref: openai.response.system_fingerprint
        requirement_level: recommended
metrics:
  - name: gen_ai.client.token.usage
    requirement_level: recommended
    instrument: histogram
    unit: "{token}"
    brief: 'Number of input and output tokens used.'
    note: > 
      This metric SHOULD be reported when an operation involves the usage 
      of tokens and the count is readily available.

      For example, if GenAI system returns usage information in the streaming response, 
      it SHOULD be used. Or if GenAI system returns each token independently, 
      instrumentation SHOULD count number of output tokens and record the result.

      If instrumentation cannot efficiently obtain number of input and/or output tokens,
      it MAY allow users to enable offline token counting. Otherwise it MUST NOT report usage metric.

      When systems report both used tokens and billable tokens, instrumentation MUST report billable tokens.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.gen_ai
      - ref: gen_ai.token.type
        requirement_level: required
  - name: gen_ai.client.operation.duration
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'GenAI operation duration.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.provider.name
        requirement_level:
          conditionally_required: If the operation involves a call to a GenAI provider.
  - name: gen_ai.client.operation.time_to_first_chunk
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'Time to receive the first chunk, measured from when the client issues the generation request to when the first chunk is received in the response stream.'
    note: >
      This metrics SHOULD be reported for streaming calls and SHOULD NOT be reported otherwise.
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.client.operation.time_per_output_chunk
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: >
      Time per output chunk, recorded for each chunk received after the first one, measured as the time elapsed from the end of the previous chunk to the end of the current chunk.
    note: >
      This metrics SHOULD be reported for streaming calls and SHOULD NOT be reported otherwise.
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.server.request.duration
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'Generative AI server request duration such as time-to-last byte or last output token.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.server.time_per_output_token
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'Time per output token generated after the first token for successful responses.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.server.time_to_first_token
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'Time to generate first token for successful responses.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.invoke_workflow.duration
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    brief: 'Records duration of GenAI workflow.'
    note: >
      Represents the end-to-end duration of a workflow execution, measured from the point
      where application code initiates the workflow to the point where the workflow completes,
      independent of workflow complexity.

      A workflow is a coordinated process composed of multiple agents or other
      operations involving generative AI.

      If instrumentation measures only a single provider-facing client operation
      (for example, one model API call), `gen_ai.client.operation.duration` SHOULD be used instead.
      Instrumentation MAY emit both metrics for the same request path when both boundaries are available.

      When this metric is reported alongside a `gen_ai.invoke_workflow.internal` span, the metric value SHOULD be the same as the span duration.

      Individual systems may include additional system-specific attributes.
      Refer to system-specific documentation, if available.
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.workflow.name
        requirement_level:
          conditionally_required: If available.
  - name: gen_ai.invoke_agent.duration
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    brief: >
      The end-to-end duration of a single in-process agent invocation,
      from the moment the invocation starts until the agent emits
      the last chunk of its final response or terminates with an error.
    note: |
      Intended for instrumentations of agent frameworks (for example, ADK,
      LangChain agents, CrewAI agents) that can reliably bound a single
      agent invocation.

      If instrumentation can only measure a single provider-facing client
      operation (for example, one model API call),
      `gen_ai.client.operation.duration` SHOULD be used instead. If
      instrumentation can reliably bound a higher-level workflow that
      coordinates multiple agents, `gen_ai.invoke_workflow.duration` SHOULD be
      used for that workflow. Instrumentation MAY emit several of these
      metrics for the same request path when more than one boundary is
      available.

      When this metric is reported alongside a `gen_ai.invoke_agent.internal`
      span, the metric value SHOULD be the same as the span duration.
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref_group: attributes.gen_ai.invoked_agent.internal.common
  - name: gen_ai.invoke_agent.inference_calls
    annotations:
      code_generation:
        metric_value_type: int
    brief: >
      The number of inference (model) calls a GenAI agent makes during a
      single invocation.
    note: |
      The distribution is scoped to a single agent invocation and SHOULD include
      only the inference calls the agent itself issued including failed ones;
      calls made by sub-agents or transferred-to agents are recorded against
      those agents' own invocations so that each inference call is counted
      exactly once across the call tree.

      This metric SHOULD be emitted together with the
      `gen_ai.invoke_agent.internal` span for the same invocation.
    instrument: histogram
    unit: "{inference_call}"
    stability: development
    attributes:
      - ref: gen_ai.agent.name
        requirement_level: recommended
  - name: gen_ai.invoke_agent.tool_calls
    annotations:
      code_generation:
        metric_value_type: int
    brief: >
      The number of tool calls a GenAI agent makes during a single
      invocation.
    note: |
      The distribution is scoped to a single agent invocation and SHOULD include
      only the tool calls the agent itself triggers including failed ones;
      calls made by sub-agents or transferred-to agents are recorded against
      those agents' own invocations so that each tool call is counted exactly
      once across the call tree.

      Only client-side tool calls (tools executed by the agent or framework)
      are counted. Tools executed server-side by the model provider (for
      example, provider built-in web search or code execution) are not
      counted here.

      This metric SHOULD be emitted together with the
      `gen_ai.invoke_agent.internal` span for the same invocation.
    instrument: histogram
    unit: "{tool_call}"
    stability: development
    attributes:
      - ref: gen_ai.agent.name
        requirement_level: recommended
  - name: gen_ai.execute_tool.duration
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    brief: >
      The duration of a single tool execution.
    note: |
      Instrumentation that can reliably bound a single tool call SHOULD
      record this metric for every tool execution they can observe.

      When this metric is reported alongside a `gen_ai.execute_tool` span,
      the metric value SHOULD be the same as the span duration.
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref_group: attributes.gen_ai.execute_tool.common
  - name: gen_ai.skill.loads
    requirement_level: recommended
    brief: >
      The number of times a skill was loaded.
    note: |
      Recorded at the same boundary as the `execute_tool` span for the
      framework's load-skill tool: one sample each time the agent activates a
      skill and reads its instructions into context. Counts every load the
      instrumentation observes, including the ones that failed and the ones that
      resolved a skill already loaded in the same invocation.

      A load that resolved no skill is counted with `error.type` and without
      `gen_ai.skill.name`, so a name the model invented cannot enter the
      dimension. The name the call asked for is on the span.

      `gen_ai.execute_tool.duration` is not dimensioned by `gen_ai.skill.*`, so
      its count cannot answer which skills an agent loads; keeping the skill
      dimensions on a separate instrument holds that cardinality off the
      duration histogram.
    instrument: counter
    unit: "{load}"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.agent.name
        requirement_level: recommended
      - ref: gen_ai.skill.name
        requirement_level:
          conditionally_required: If the name resolves to a skill available to the agent.
    annotations:
      code_generation:
        metric_value_type: int
  - name: gen_ai.skill.script.executions
    requirement_level: recommended
    brief: The number of times a skill's script was executed.
    note: |
      Recorded at the same boundary as the `execute_tool` span for the
      framework's run-skill-script tool.

      `error.type` and `gen_ai.skill.script.exited_with_error` report different
      outcomes: the first says the execution itself failed, the second says the
      script ran and exited non-zero. An execution that never reached the script
      has no `gen_ai.skill.script.exited_with_error`, and neither does one whose
      framework runs the script without reporting the status it exited with. That
      keeps the script's own outcome low-cardinality; the exit code itself is
      recorded on the span as `gen_ai.skill.script.exit_code`.
    instrument: counter
    unit: "{execution}"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.agent.name
        requirement_level: recommended
      - ref: gen_ai.skill.name
        requirement_level:
          conditionally_required: If the name resolves to a skill available to the agent.
      - ref: gen_ai.skill.script.path
        requirement_level:
          recommended: If the path resolves to a script bundled with the skill.
      - ref: gen_ai.skill.script.exited_with_error
        requirement_level:
          conditionally_required: If the instrumentation can determine the status the script exited with.
    annotations:
      code_generation:
        metric_value_type: int
  - name: gen_ai.invoke_agent.skill.loads
    requirement_level: recommended
    brief: >
      The number of skills a GenAI agent activates during a single invocation.
    note: |
      The distribution is scoped to a single agent invocation. A sample
      SHOULD be recorded for every invocation, including one that ended in an
      error.

      This metric SHOULD be emitted together with the
      `gen_ai.invoke_agent.internal` span for the same invocation.
    instrument: histogram
    unit: "{skill}"
    stability: development
    attributes:
      - ref: gen_ai.agent.name
        requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
  - name: gen_ai.invoke_workflow.skill.loads
    requirement_level: recommended
    brief: >
      The number of skills activated during a single workflow invocation.
    note: |
      The distribution is scoped to a single workflow invocation.
      A sample SHOULD be recorded for every workflow
      invocation, including one that ended in an error.

      This metric SHOULD be emitted together with the
      `gen_ai.invoke_workflow.internal` span for the same invocation.
    instrument: histogram
    unit: "{skill}"
    stability: development
    attributes:
      - ref: gen_ai.workflow.name
        requirement_level:
          conditionally_required: When available.
    annotations:
      code_generation:
        metric_value_type: int

metric_refinements:
  - id: openai.client.token.usage
    ref: gen_ai.client.token.usage
    brief: >
      OpenAI-specific extension to `gen_ai.client.token.usage`. Adds
      `openai.response.service_tier` and `openai.response.system_fingerprint`
      when the provider is `openai`.
    stability: development
    attributes:
      # - ref_group: metric_attributes.openai - does not work, https://github.com/open-telemetry/weaver/issues/1411
      - ref: openai.response.service_tier
        requirement_level: recommended
      - ref: openai.response.system_fingerprint
        requirement_level: recommended
  - id: openai.client.operation.duration
    ref: gen_ai.client.operation.duration
    brief: >
      OpenAI-specific extension to `gen_ai.client.operation.duration`. Adds
      `openai.response.service_tier` and `openai.response.system_fingerprint`
      when the provider is `openai`.
    stability: development
    attributes:
      # - ref_group: metric_attributes.openai - does not work, https://github.com/open-telemetry/weaver/issues/1411
      - ref: openai.response.service_tier
        requirement_level: recommended
      - ref: openai.response.system_fingerprint
        requirement_level: recommended
