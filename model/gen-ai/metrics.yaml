file_format: definition/2
attribute_groups:
  - id: metric_attributes.gen_ai
    visibility: internal
    attributes:
      - ref_group: attributes.gen_ai.address_and_port
      - ref_group: attributes.gen_ai.common
      - ref: gen_ai.response.model
        requirement_level: recommended
      - ref: gen_ai.provider.name
        requirement_level: required

  - id: metric_attributes.openai
    visibility: internal
    attributes:
      - ref: openai.response.service_tier
        requirement_level: recommended
      - ref: openai.response.system_fingerprint
        requirement_level: recommended
metrics:
  - name: gen_ai.client.token.usage
    instrument: histogram
    unit: "{token}"
    brief: 'Number of input and output tokens used.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.gen_ai
      - ref: gen_ai.token.type
        requirement_level: required
  - name: gen_ai.client.operation.duration
    instrument: histogram
    unit: "s"
    brief: 'GenAI operation duration.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.provider.name
        requirement_level:
          conditionally_required: If the operation involves a call to a GenAI provider.
  - name: gen_ai.client.operation.time_to_first_chunk
    instrument: histogram
    unit: "s"
    brief: 'Time to receive the first chunk, measured from when the client issues the generation request to when the first chunk is received in the response stream.'
    note: >
      This metrics SHOULD be reported for streaming calls and SHOULD NOT be reported otherwise.
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.client.operation.time_per_output_chunk
    instrument: histogram
    unit: "s"
    brief: >
      Time per output chunk, recorded for each chunk received after the first one, measured as the time elapsed from the end of the previous chunk to the end of the current chunk.
    note: >
      This metrics SHOULD be reported for streaming calls and SHOULD NOT be reported otherwise.
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.server.request.duration
    instrument: histogram
    unit: "s"
    brief: 'Generative AI server request duration such as time-to-last byte or last output token.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.server.time_per_output_token
    instrument: histogram
    unit: "s"
    brief: 'Time per output token generated after the first token for successful responses.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.server.time_to_first_token
    instrument: histogram
    unit: "s"
    brief: 'Time to generate first token for successful responses.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.workflow.duration
    annotations:
      code_generation:
        metric_value_type: double
    brief: 'GenAI workflow duration.'
    note: >
      This metric instrument describes an operation that executes a coordinated process
      composed of multiple agents or other operations involving generative AI.
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.workflow.name
        requirement_level:
          conditionally_required: If available.
  - name: gen_ai.agent.input.content.size
    annotations:
      code_generation:
        metric_value_type: int
    brief: >
      The byte size of the content the GenAI agent receives at the agent
      boundary for a single invocation.
    note: |
      Intended for instrumentations of agent frameworks (for example, ADK,
      LangChain agents, CrewAI agents) that can observe the content passed
      to the agent at its entrypoint. Useful for capacity planning,
      anomaly detection (for example, a user pasting a very large prompt),
      and sizing downstream services (token budgets, vector DB inputs,
      storage).

      Instrumentations SHOULD record the byte size of the content the
      agent receives, as observed at the framework's entrypoint. The exact
      encoding is framework-defined (for example, a framework that exposes
      content as typed parts MAY sum the UTF-8 byte length of text parts
      and the raw byte length of binary parts; a framework that handles
      content as a serialized payload MAY use the byte length of that
      serialization). Instrumentations SHOULD document what they count so
      operators can interpret the values correctly within a given
      framework.
    instrument: histogram
    unit: "By"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.agent.name
        requirement_level: recommended
  - name: gen_ai.agent.output.content.size
    annotations:
      code_generation:
        metric_value_type: int
    brief: >
      The byte size of the content the GenAI agent produces at the agent
      boundary for a single invocation.
    note: |
      Intended for instrumentations of agent frameworks (for example, ADK,
      LangChain agents, CrewAI agents) that can observe the agent's final
      output. Useful for capacity planning, spotting unusually large
      responses, and correlating size with latency or error rate.

      Includes only the agent's final response content. Intermediate
      content produced inside the invocation (tool calls, tool results,
      reasoning steps) SHOULD NOT be counted.

      Instrumentations SHOULD record the byte size of the content the
      agent produces, as observed at the framework's exit point. The exact
      encoding is framework-defined (for example, a framework that exposes
      content as typed parts MAY sum the UTF-8 byte length of text parts
      and the raw byte length of binary parts; a framework that handles
      content as a serialized payload MAY use the byte length of that
      serialization). Instrumentations SHOULD document what they count so
      operators can interpret the values correctly within a given
      framework.
    instrument: histogram
    unit: "By"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.agent.name
        requirement_level: recommended

metric_refinements:
  - id: openai.client.token.usage
    ref: gen_ai.client.token.usage
    brief: >
      OpenAI-specific extension to `gen_ai.client.token.usage`. Adds
      `openai.response.service_tier` and `openai.response.system_fingerprint`
      when the provider is `openai`.
    stability: development
    attributes:
      # - ref_group: metric_attributes.openai - does not work, https://github.com/open-telemetry/weaver/issues/1411
      - ref: openai.response.service_tier
        requirement_level: recommended
      - ref: openai.response.system_fingerprint
        requirement_level: recommended
  - id: openai.client.operation.duration
    ref: gen_ai.client.operation.duration
    brief: >
      OpenAI-specific extension to `gen_ai.client.operation.duration`. Adds
      `openai.response.service_tier` and `openai.response.system_fingerprint`
      when the provider is `openai`.
    stability: development
    attributes:
      # - ref_group: metric_attributes.openai - does not work, https://github.com/open-telemetry/weaver/issues/1411
      - ref: openai.response.service_tier
        requirement_level: recommended
      - ref: openai.response.system_fingerprint
        requirement_level: recommended
