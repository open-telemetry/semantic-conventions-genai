file_format: definition/2
attribute_groups:
  - id: metric_attributes.gen_ai
    visibility: internal
    attributes:
      - ref_group: attributes.gen_ai.address_and_port
      - ref_group: attributes.gen_ai.common
      - ref: gen_ai.response.model
        requirement_level: recommended
      - ref: gen_ai.provider.name
        requirement_level: required

  - id: metric_attributes.openai
    visibility: internal
    attributes:
      - ref: openai.response.service_tier
        requirement_level: recommended
      - ref: openai.response.system_fingerprint
        requirement_level: recommended
metrics:
  - name: gen_ai.client.operation.duration
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'GenAI operation duration.'
    note: >
      This metric SHOULD NOT be reported for inference operations;
      use `gen_ai.client.inference.duration` instead.
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.provider.name
        requirement_level:
          conditionally_required: If the operation involves a call to a GenAI provider.
  - name: gen_ai.client.inference.duration
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'GenAI client inference operation duration.'
    note: >
      Represents the end-to-end duration of a model inference operation,
      measured from when the client issues the inference request to when the
      response is fully received or the operation ends with an error or cancellation.

      When this metric is reported alongside a `gen_ai.client.inference`
      span, the metric value SHOULD be the same as the span duration.
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.client.inference.time_to_first_chunk
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'Time to receive the first chunk, measured from when the client issues the generation request to when the first chunk is received in the response stream.'
    note: >
      This metric SHOULD be reported for streaming calls and SHOULD NOT be reported otherwise.
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.client.inference.time_per_output_chunk
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: >
      Time per output chunk, recorded for each chunk received after the first one, measured as the time elapsed from the end of the previous chunk to the end of the current chunk.
    note: >
      This metric SHOULD be reported for streaming calls and SHOULD NOT be reported otherwise.
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.server.request.duration
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'Generative AI server request duration such as time-to-last byte or last output token.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
      - ref_group: attributes.gen_ai.error
  - name: gen_ai.server.time_per_output_token
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'Time per output token generated after the first token for successful responses.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.server.time_to_first_token
    requirement_level: recommended
    instrument: histogram
    unit: "s"
    brief: 'Time to generate first token for successful responses.'
    stability: development
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.gen_ai
  - name: gen_ai.invocation.duration
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    brief: >
      The end-to-end duration of an in-process GenAI conversation turn, workflow,
      or agent invocation.
    note: |
      Measured from the moment the invocation starts until it emits the last
      chunk of its final response, releases control flow back to its caller,
      or terminates with an error. When reported alongside a
      `gen_ai.invocation.internal` span, the value SHOULD be the same as the
      span duration.

      Recorded for every `gen_ai.invocation.internal` operation at any nesting
      depth; values include nested work. Filter by
      `gen_ai.invocation.is_nested = false` for end-to-end turn latency, and by
      `gen_ai.operation.name` with `gen_ai.agent.name` or
      `gen_ai.workflow.name` for individual agents and workflows.

      Disabling the `handle_conversation_turn` span SHOULD NOT disable its
      data point of this metric: in a handoff, several top-level peer
      invocations would otherwise each report `gen_ai.invocation.is_nested`
      set to `false` for the same turn.

      If instrumentation can only measure a single provider-facing client
      operation (for example, one model API call),
      `gen_ai.client.inference.duration` or `gen_ai.client.operation.duration`
      SHOULD be used instead.
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.operation.name
        requirement_level: required
      - ref: gen_ai.invocation.is_nested
        requirement_level: required
      - ref: gen_ai.agent.name
        brief: >
          The human-readable name of the invoked GenAI agent, or the
          entry-point agent when `gen_ai.operation.name` is
          `handle_conversation_turn`.
        requirement_level:
          conditionally_required: When the invoked or entry-point entity is an agent and the name is available.
      - ref: gen_ai.workflow.name
        requirement_level:
          conditionally_required: When the invoked or entry-point entity is a workflow and the name is available.
      - ref: gen_ai.request.model
        brief: The name of the GenAI model configured for the agent.
        requirement_level:
          recommended: If applicable.
        note: >
          This attribute SHOULD be populated if and only if the instrumented
          library allows to set only a single model per agent. It SHOULD NOT
          be populated for `handle_conversation_turn`, for workflows, or for agents that
          support multiple models or dynamic selection.
  - name: gen_ai.invoke_agent.inference_calls
    annotations:
      code_generation:
        metric_value_type: int
    brief: >
      The number of inference (model) calls a GenAI agent makes during a
      single invocation.
    note: |
      The distribution is scoped to a single agent invocation and SHOULD include
      only the inference calls the agent itself issued including failed ones;
      calls made by sub-agents or transferred-to agents are recorded against
      those agents' own invocations so that each inference call is counted
      exactly once across the call tree.

      This metric SHOULD be emitted together with the
      `gen_ai.invocation.internal` span (with `gen_ai.operation.name` set to
      `invoke_agent`) for the same invocation.
    instrument: histogram
    unit: "{inference_call}"
    stability: development
    attributes:
      - ref: gen_ai.agent.name
        requirement_level: recommended
  - name: gen_ai.invoke_agent.tool_calls
    annotations:
      code_generation:
        metric_value_type: int
    brief: >
      The number of tool calls a GenAI agent makes during a single
      invocation.
    note: |
      The distribution is scoped to a single agent invocation and SHOULD include
      only the tool calls the agent itself triggers including failed ones;
      calls made by sub-agents or transferred-to agents are recorded against
      those agents' own invocations so that each tool call is counted exactly
      once across the call tree.

      Only client-side tool calls (tools executed by the agent or framework)
      are counted. Tools executed server-side by the model provider (for
      example, provider built-in web search or code execution) are not
      counted here.

      This metric SHOULD be emitted together with the
      `gen_ai.invocation.internal` span (with `gen_ai.operation.name` set to
      `invoke_agent`) for the same invocation.
    instrument: histogram
    unit: "{tool_call}"
    stability: development
    attributes:
      - ref: gen_ai.agent.name
        requirement_level: recommended
  - name: gen_ai.execute_tool.duration
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    brief: >
      The duration of a single tool execution.
    note: |
      Instrumentation that can reliably bound a single tool call SHOULD
      record this metric for every tool execution they can observe.

      When this metric is reported alongside a `gen_ai.execute_tool` span,
      the metric value SHOULD be the same as the span duration.
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref_group: attributes.gen_ai.execute_tool.common

metric_refinements:
  - id: openai.client.operation.duration
    ref: gen_ai.client.operation.duration
    brief: >
      OpenAI-specific extension to `gen_ai.client.operation.duration`. Adds
      `openai.response.service_tier` and `openai.response.system_fingerprint`
      when the provider is `openai`.
    stability: development
    attributes:
      # - ref_group: metric_attributes.openai - does not work, https://github.com/open-telemetry/weaver/issues/1411
      - ref: openai.response.service_tier
        requirement_level: recommended
      - ref: openai.response.system_fingerprint
        requirement_level: recommended
  - id: openai.gen_ai.client.inference.duration
    ref: gen_ai.client.inference.duration
    brief: >
      OpenAI-specific extension to `gen_ai.client.inference.duration`. Adds
      `openai.response.service_tier` and `openai.response.system_fingerprint`
      when the provider is `openai`.
    stability: development
    attributes:
      - ref: openai.response.service_tier
        requirement_level: recommended
      - ref: openai.response.system_fingerprint
        requirement_level: recommended
