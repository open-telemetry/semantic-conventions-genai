file_format: definition/2
events:
  - name: gen_ai.client.inference.operation.details
    requirement_level: opt_in
    brief: >
      Describes the details of a GenAI completion request including chat history
      and parameters.
    note: >
      This event could be used to store input and output details
      independently from traces.

      Instrumentations SHOULD set the severity to DEBUG (severity number 5) when recording this event.
    stability: development
    attributes:
      - ref_group: span.gen_ai.inference.client
  - name: gen_ai.evaluation.result
    requirement_level: recommended
    brief: >
      This event captures the result of evaluating GenAI output for quality, accuracy, or other characteristics.
      This event SHOULD be parented to GenAI operation span being evaluated when possible
      or set `gen_ai.response.id` when span id is not available.
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.evaluation.name
        requirement_level: required
      - ref: gen_ai.evaluation.score.value
        requirement_level:
          conditionally_required: If applicable.
      - ref: gen_ai.evaluation.score.label
        requirement_level:
          conditionally_required: If applicable.
      - ref: gen_ai.evaluation.explanation
        requirement_level: recommended
      - ref: gen_ai.response.id
        requirement_level:
          recommended: When available.
        note: |
          The unique identifier assigned to the specific
          completion being evaluated. This attribute helps correlate the evaluation
          event with the corresponding operation when span id is not available.

  - name: gen_ai.guardrail.result
    requirement_level: recommended
    brief: >
      Describes a result produced by a guardrail.
    note: |
      This event SHOULD be emitted for results returned by remote guardrail
      services and dedicated in-process guardrail APIs.

      A guardrail operation MAY emit multiple result events when the API reports
      multiple categories, filters, or checks. Instrumentations MUST preserve
      provider-native result values and MUST NOT infer an allow or deny verdict
      from scores or categories.
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.guardrail.component.name
        requirement_level:
          recommended: If available.
      - ref: gen_ai.guardrail.result.type
        requirement_level:
          conditionally_required: If the guardrail API reports a named result field or result kind.
      - ref: gen_ai.guardrail.result.value
        requirement_level:
          conditionally_required: If `gen_ai.guardrail.result.type` is set.
      - ref: gen_ai.guardrail.result.reason
        requirement_level:
          recommended: If available.
      - ref: gen_ai.guardrail.source
        requirement_level:
          conditionally_required: If the guardrail API reports the source or stage of the evaluated content.
      - ref: gen_ai.guardrail.risk.category
        requirement_level:
          conditionally_required: If the guardrail API reports a risk category.
      - ref: gen_ai.guardrail.risk.score
        requirement_level:
          conditionally_required: If the guardrail API reports a risk, confidence, or severity score.
      - ref: gen_ai.guardrail.policy.id
        requirement_level:
          conditionally_required: If the guardrail API accepts or reports a policy identifier.
      - ref: gen_ai.guardrail.policy.version
        requirement_level:
          conditionally_required: If the guardrail API accepts or reports a policy version.
      - ref: gen_ai.guardrail.policy.rule.id
        requirement_level:
          recommended: If available.
      - ref: gen_ai.provider.name
        requirement_level:
          recommended: If available.
      - ref: gen_ai.guardrail.content.input.value
        requirement_level: opt_in
      - ref: gen_ai.guardrail.content.output.value
        requirement_level: opt_in

  - name: gen_ai.client.operation.exception
    requirement_level: recommended
    brief: >
      This event represents an exception that occurred during a Generative AI client operation,
      such as API errors, rate limiting, model errors, timeouts, or other errors that prevent
      the operation from completing successfully.
    note: >
      This event SHOULD be recorded when an exception occurs during Generative AI client operations.

      Instrumentations SHOULD set the severity to WARN (severity number 13) when recording this event.

      Instrumentations MAY provide a configuration option to populate exception events
      with the attributes captured on the corresponding Generative AI client span.
    stability: development
    attributes:
      - ref: exception.type
        requirement_level:
          conditionally_required: Required if `exception.message` is not set, recommended otherwise.
      - ref: exception.message
        requirement_level:
          conditionally_required: Required if `exception.type` is not set, recommended otherwise.
      - ref: exception.stacktrace
