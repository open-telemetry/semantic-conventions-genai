    brief: >
      OpenAI-specific extension to `gen_ai.client.inference.usage.detailed.cache_read.input_tokens`. Adds
      `openai.response.service_tier` and `openai.response.system_fingerprint`
      when the provider is `openai`.
    stability: development
    attributes:
      - ref_group: metric_attributes.openai
  - id: openai.client.inference.usage.detailed.cache_write.input_tokens
    ref: gen_ai.client.inference.usage.detailed.cache_write.input_tokens
    brief: >
