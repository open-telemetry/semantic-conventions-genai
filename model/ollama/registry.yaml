file_format: definition/2
attributes:
  - key: ollama.request.base_url
    type: string
    brief: The base URL of the Ollama API endpoint.
    examples: ['http://localhost:11434', 'https://ollama.example.com']
    stability: development
    note: >
      This is useful when using a custom or self-hosted Ollama instance.

  - key: ollama.request.num_ctx
    type: int
    brief: The size of the context window for the model.
    examples: [2048, 4096, 32768]
    stability: development
    note: >
      This represents the maximum number of tokens the model can consider from the
      conversation history.

  - key: ollama.request.num_batch
    type: int
    brief: The number of tokens to process in parallel.
    examples: [8, 16, 32]
    stability: development

  - key: ollama.request.num_gpu
    type: int
    brief: The number of GPUs to use for inference.
    examples: [1, 2, 4]
    stability: development

  - key: ollama.request.main_gpu
    type: int
    brief: The index of the main GPU to use.
    examples: [0, 1]
    stability: development

  - key: ollama.request.low_vram
    type: boolean
    brief: Indicates whether to use low VRAM mode.
    examples: [true, false]
    stability: development

  - key: ollama.request.f16_kv
    type: boolean
    brief: Indicates whether to use 16-bit floating point for key-value cache.
    examples: [true, false]
    stability: development

  - key: ollama.response.total_duration
    type: int
    brief: The total time in nanoseconds the model took to generate the response.
    examples: [1500000000]
    stability: development
    note: >
      Ollama reports this value natively in the response. It measures the full
      server-side generation time, including model load time.

  - key: ollama.response.load_duration
    type: int
    brief: The time in nanoseconds the model took to load.
    examples: [500000000]
    stability: development

span_refinements:
  - id: ollama.gen_ai.client.inference
    ref: gen_ai.client.inference
    brief: >
      Semantic Conventions for [Ollama](https://ollama.com/) client spans extend
      and override the semantic conventions for [Gen AI Spans](gen-ai-spans.md).
    note: |
      `gen_ai.provider.name` MUST be set to `"ollama"` and SHOULD be provided **at span creation time**.
    stability: development
    attributes:
      - ref: ollama.request.base_url
        requirement_level: recommended
        note: >
          Corresponds to the `host` configuration of the Ollama client: the base
          URL of the API endpoint the client connects to.
      - ref: ollama.request.num_ctx
        requirement_level:
          conditionally_required: If the request `options` include `num_ctx`.
        note: >
          Corresponds to the `num_ctx` option in the request `options` object.
      - ref: ollama.request.num_batch
        requirement_level:
          conditionally_required: If the request `options` include `num_batch`.
        note: >
          Corresponds to the `num_batch` option in the request `options` object.
      - ref: ollama.request.num_gpu
        requirement_level:
          conditionally_required: If the request `options` include `num_gpu`.
        note: >
          Corresponds to the `num_gpu` option in the request `options` object.
      - ref: ollama.request.main_gpu
        requirement_level:
          conditionally_required: If the request `options` include `main_gpu`.
        note: >
          Corresponds to the `main_gpu` option in the request `options` object.
      - ref: ollama.request.low_vram
        requirement_level:
          conditionally_required: If the request `options` include `low_vram`.
        note: >
          Corresponds to the `low_vram` option in the request `options` object.
      - ref: ollama.request.f16_kv
        requirement_level:
          conditionally_required: If the request `options` include `f16_kv`.
        note: >
          Corresponds to the `f16_kv` option in the request `options` object.
      - ref: ollama.response.total_duration
        requirement_level: recommended
        note: >
          Corresponds to the `total_duration` field of the Ollama response.
      - ref: ollama.response.load_duration
        requirement_level: recommended
        note: >
          Corresponds to the `load_duration` field of the Ollama response.

  - id: ollama.gen_ai.client.embeddings
    ref: gen_ai.client.embeddings
    brief: >
      Semantic Conventions for [Ollama](https://ollama.com/) embeddings operations
      extend and override the semantic conventions for [Gen AI Spans](gen-ai-spans.md).
    note: |
      `gen_ai.provider.name` MUST be set to `"ollama"` and SHOULD be provided **at span creation time**.
    stability: development
    attributes:
      - ref: ollama.request.base_url
        requirement_level: recommended
        note: >
          Corresponds to the `host` configuration of the Ollama client: the base
          URL of the API endpoint the client connects to.
      - ref: ollama.response.total_duration
        requirement_level: recommended
        note: >
          Corresponds to the `total_duration` field of the Ollama response.
      - ref: ollama.response.load_duration
        requirement_level: recommended
        note: >
          Corresponds to the `load_duration` field of the Ollama response.
