runner: genai-conformance
instrumented_library: openai-agents
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          missing_attribute: gen_ai.response.finish_reasons
          operation: invoke_agent
        reason: Error span has no response; the conformance policy does not skip response attributes on error spans.
      - id: genai_expected_attribute_missing
        context:
          missing_attribute: gen_ai.usage.input_tokens
          operation: invoke_agent
        reason: Error span has no response; the conformance policy does not skip response attributes on error spans.
      - id: genai_expected_attribute_missing
        context:
          missing_attribute: gen_ai.usage.output_tokens
          operation: invoke_agent
        reason: Error span has no response; the conformance policy does not skip response attributes on error spans.
      - id: missing_attribute
        context:
          attribute_key: process.executable.name
        reason: Registry validation does not recognize this process attribute referenced by the command-tool refinement.
      - id: missing_attribute
        context:
          attribute_key: process.executable.path
        reason: Registry validation does not recognize this process attribute referenced by the command-tool refinement.
      - id: missing_attribute
        context:
          attribute_key: process.exit.code
        reason: Registry validation does not recognize this process attribute referenced by the command-tool refinement.
      - id: genai_span_name_format
        context:
          expected_form: execute_tool exec_command
          keyed_attr: gen_ai.tool.name
          operation: execute_tool
        reason: The runner does not recognize the span-name refinements for skill and command tools.
    spans:
      - match:
          attributes:
            gen_ai.operation.name: execute_tool
          type: gen_ai.execute_tool.internal
