runner: genai-conformance
instrumented_library: google-genai
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          missing_attribute: gen_ai.response.finish_reasons
          operation: chat
        reason: The Interactions API exposes interaction status, not per-generation finish reasons.
      - id: genai_expected_attribute_missing
        context:
          missing_attribute: gen_ai.request.encoding_formats
          operation: embeddings
        reason: The Gemini embedContent API has no encoding format parameter.
      - id: genai_expected_attribute_missing
        context:
          missing_attribute: gen_ai.response.model
          operation: embeddings
        reason: The Gemini embedContent response does not include a model.
      - id: genai_expected_attribute_missing
        context:
          missing_attribute: gen_ai.usage.input_tokens
          operation: embeddings
        reason: The SDK does not expose usage for embedContent.
      - id: genai_expected_attribute_missing
        context:
          missing_attribute: gen_ai.response.finish_reasons
          operation: invoke_agent
        reason: The agent response exposes no per-generation finish reason; completion status alone does not supply one.
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
          type: gen_ai.client.inference
      - match:
          attributes:
            gen_ai.response.id: stream-usage
          type: gen_ai.client.inference
        expect:
          count: 1
          attributes:
            gen_ai.usage.input_tokens: 15
            gen_ai.usage.output_tokens: 12
            gen_ai.usage.reasoning.output_tokens: 5
      - match:
          attributes:
            gen_ai.operation.name: generate_content
          type: gen_ai.client.inference
      - match:
          attributes:
            gen_ai.operation.name: text_completion
          type: gen_ai.client.inference
      - match:
          attributes:
            gen_ai.operation.name: embeddings
          type: gen_ai.client.embeddings
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
          kind: client
          type: gen_ai.client.invoke_agent
      - match:
          attributes:
            gen_ai.operation.name: create_agent
          type: gen_ai.create_agent.client
      - match:
          attributes:
            gen_ai.operation.name: execute_tool
          type: gen_ai.execute_tool
