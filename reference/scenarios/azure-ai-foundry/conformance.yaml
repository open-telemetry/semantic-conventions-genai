runner: genai-conformance
instrumented_library: azure-ai-foundry
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.response.finish_reasons
        reason: >-
          The agent-scoped Responses API exposes aggregate response lifecycle status, not a
          provider-returned model generation finish reason.
