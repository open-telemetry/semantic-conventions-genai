[project]
name = "azure-ai-foundry-reference-test"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects==2.5.0",
    "azure-identity==1.25.3",
    # azure-ai-projects imports httpx without declaring it; openai 3.x no longer pulls it in
    "httpx",
    "genai-reference-shared",
]

[tool.uv.sources]
genai-reference-shared = { path = "../../shared", editable = true }

[tool.uv]
package = false
