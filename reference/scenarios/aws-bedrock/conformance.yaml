runner: genai-conformance
instrumented_library: aws-bedrock
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      # TODO: update mock to return model and responseId in converse and invoke responses
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: Mock needs to return responseId in converse response.
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: Mock needs to return model in converse response.
      - id: genai_expected_attribute_missing
        context:
          operation: embeddings
          missing_attribute: gen_ai.response.model
        reason: Mock needs to return model in invoke_model response.
