runner: genai-conformance
instrumented_library: groq
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      # TODO: add stream_options usage support to groq streaming or mock
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.usage.input_tokens
        reason: Mock needs to include usage in streaming chunks.
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.usage.output_tokens
        reason: Mock needs to include usage in streaming chunks.
