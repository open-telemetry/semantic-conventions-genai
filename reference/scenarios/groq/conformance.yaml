runner: genai-conformance
instrumented_library: groq
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
          type: gen_ai.client.inference
      - match:
          attributes:
            gen_ai.operation.name: generate_content
          type: gen_ai.client.inference
      - match:
          attributes:
            gen_ai.operation.name: text_completion
          type: gen_ai.client.inference
    metrics:
      - gen_ai.client.inference.duration
      - gen_ai.client.inference.operation.input_tokens
      - gen_ai.client.inference.operation.output_tokens
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens

  streaming_usage:
    run: uv run --frozen --python 3.12 --project . python scenario.py --stream-fixture usage
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
          type: gen_ai.client.inference
        expect:
          count: 1
          attributes:
            gen_ai.usage.input_tokens: 5
            gen_ai.usage.output_tokens: 2
            gen_ai.usage.cache_read.input_tokens: 3
            gen_ai.usage.reasoning.output_tokens: 1
            error.type:
              present: false
    metrics:
      - gen_ai.client.inference.duration
      - gen_ai.client.inference.operation.input_tokens
      - gen_ai.client.inference.operation.output_tokens
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.reasoning.output_tokens
  streaming_early_stop:
    run: uv run --frozen --python 3.12 --project . python scenario.py --stream-fixture early-stop
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
          type: gen_ai.client.inference
        expect:
          count: 1
          attributes:
            gen_ai.usage.input_tokens: 5
            gen_ai.usage.output_tokens: 2
            gen_ai.usage.cache_read.input_tokens: 3
            gen_ai.usage.reasoning.output_tokens: 1
            error.type: groq.stream_error
            gen_ai.response.finish_reasons: [error]
    metrics:
      - gen_ai.client.inference.duration
      - gen_ai.client.inference.operation.input_tokens
      - gen_ai.client.inference.operation.output_tokens
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.reasoning.output_tokens
