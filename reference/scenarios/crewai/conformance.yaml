runner: genai-conformance
instrumented_library: crewai
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: execute_tool
          missing_attribute: gen_ai.tool.call.id
        reason: Tool call ID not accessible at execution point in CrewAI.
      # TODO: relax gen_ai.output.messages schema to make finish_reason optional
      - id: genai_content_schema
        reason: crew.kickoff() exposes no finish_reason; make finish_reason optional in schema.
