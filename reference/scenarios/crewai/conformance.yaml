runner: genai-conformance
instrumented_library: crewai
instrumentation_library: reference

server:
  run: genai-mock-server --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    expected_violations:
      - id: genai_span_name_format
        context:
          expected_form: invoke_workflow
          keyed_attr: gen_ai.workflow.name
          operation: invoke_workflow
        reason: The runner still keys invoke_workflow span names on gen_ai.workflow.name.
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_workflow
          type: gen_ai.invoke_agent.internal
      - match:
          attributes:
            gen_ai.operation.name: execute_tool
          type: gen_ai.execute_tool
