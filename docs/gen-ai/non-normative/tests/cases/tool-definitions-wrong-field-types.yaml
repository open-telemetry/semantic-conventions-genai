# yaml-language-server: $schema=../case.schema.json
description: >
  A `function` tool definition with a non-string `description` and
  `parameters` that are not a valid JSON Schema draft-07 document
schema: gen-ai-tool-definitions.json
document: [
  { "type": "function", "name": "get_weather", "description": 123 },
  { "type": "function", "name": "get_weather", "parameters": { "type": "not-a-type" } }
]
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $[0].description
    keyword: type
    message: 123 is not of type 'string'
  - path: $[1].parameters.type
    keyword: anyOf
    message: "'not-a-type' is not valid under any of the given schemas"
