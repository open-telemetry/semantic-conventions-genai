# yaml-language-server: $schema=../case.schema.json
description: A `value` result's `is_error` must be a boolean
schema: gen-ai-tool-call-result.json
document: { "type": "value", "content": "failed", "is_error": "yes" }
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $.is_error
    keyword: type
    message: "'yes' is not of type 'boolean'"
