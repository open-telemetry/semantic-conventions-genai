# yaml-language-server: $schema=../case.schema.json
description: Memory records may omit `content`, while `metadata` must be an object when present
schema: gen-ai-memory-records.json
document: [
  { "id": "mem-1" },
  { "content": "x", "metadata": "source=chat" }
]
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $[1].metadata
    keyword: type
    message: "'source=chat' is not of type 'object'"
