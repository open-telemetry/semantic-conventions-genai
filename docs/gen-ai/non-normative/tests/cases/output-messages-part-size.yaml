# yaml-language-server: $schema=../case.schema.json
description: >
  Output `blob` parts take the same `size` as input parts; a negative value is
  rejected.
schema: gen-ai-output-messages.json
document: [
  {
    "role": "assistant",
    "finish_reason": "stop",
    "parts": [
      { "type": "blob", "modality": "image", "mime_type": "image/png", "size": 204800 },
      { "type": "blob", "modality": "image", "mime_type": "image/png", "size": -1 }
    ]
  }
]
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $[0].parts[1].size
    keyword: minimum
    message: -1 is less than the minimum of 0
