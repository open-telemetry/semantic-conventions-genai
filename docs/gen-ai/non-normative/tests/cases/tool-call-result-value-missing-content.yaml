# yaml-language-server: $schema=../case.schema.json
description: A `value` result needs `content`; it doesn't fall back to the catch-all type
schema: gen-ai-tool-call-result.json
document: { "type": "value" }
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $
    keyword: required
    message: "'content' is a required property"
