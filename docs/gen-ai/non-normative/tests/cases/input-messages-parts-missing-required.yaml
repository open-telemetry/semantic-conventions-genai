# yaml-language-server: $schema=../case.schema.json
description: A text part without `content`, and a blob part without `modality` or `content`
schema: gen-ai-input-messages.json
document: [
  {
    "role": "user",
    "parts": [
      { "type": "text" },
      { "type": "blob", "mime_type": "image/png" }
    ]
  }
]
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $[0].parts[0]
    keyword: required
    message: "'content' is a required property"
  - path: $[0].parts[1]
    keyword: required
    message: "'content' is a required property"
  - path: $[0].parts[1]
    keyword: required
    message: "'modality' is a required property"
