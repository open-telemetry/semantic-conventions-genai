# yaml-language-server: $schema=../case.schema.json
description: >
  `finish_reason` and part `type` accept strings, not other JSON types;
  `parts` must be an array; non-discriminator wrapper fields (`role`, `parts`,
  `finish_reason`) may be omitted
schema: gen-ai-output-messages.json
document: [
  { "role": "assistant", "parts": [{ "type": 123 }], "finish_reason": 0 },
  { "role": "assistant", "parts": { "type": "text", "content": "oops" } },
  { "finish_reason": "stop" },
  { "parts": [{ "type": "text" }] }
]
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $[0].finish_reason
    keyword: type
    message: 0 is not of type 'string'
  - path: $[0].parts[0].type
    keyword: type
    message: 123 is not of type 'string'
  - path: $[1].parts
    keyword: type
    message: "{'type': 'text', 'content': 'oops'} is not of type 'array'"
