# yaml-language-server: $schema=../case.schema.json
description: >
  A part with a defined `type` must match that part's schema; it is not
  accepted as a generic part. Here a text part has non-string `content` and a
  tool call part has a non-string `name`.
schema: gen-ai-input-messages.json
document: [
  {
    "role": "user",
    "parts": [
      { "type": "text", "content": 123 },
      { "type": "tool_call", "name": 42 }
    ]
  }
]
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $[0].parts[0].content
    keyword: type
    message: 123 is not of type 'string'
  - path: $[0].parts[1].name
    keyword: type
    message: 42 is not of type 'string'
