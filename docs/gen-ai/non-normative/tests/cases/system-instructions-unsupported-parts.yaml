# yaml-language-server: $schema=../case.schema.json
description: >
  A bare string and malformed `text` parts in system instructions
  (missing `content` or non-string `content`) are rejected and do not
  fall through to generic parts
schema: gen-ai-system-instructions.json
document: [
  "You are a helpful bot",
  { "type": "text" },
  { "type": "text", "content": 123 }
]
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $[0]
    keyword: type
    message: "'You are a helpful bot' is not of type 'object'"
  - path: $[1]
    keyword: required
    message: "'content' is a required property"
  - path: $[2].content
    keyword: type
    message: 123 is not of type 'string'
