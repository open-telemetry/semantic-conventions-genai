# yaml-language-server: $schema=../case.schema.json
description: >
  A bare string, a part missing its `type` discriminator, and a `text` part
  with non-string `content` in system instructions are rejected and do not
  fall through to generic parts, while a `text` part omitting `content` is
  valid
schema: gen-ai-system-instructions.json
document: [
  "You are a helpful bot",
  { "content": "You are a helpful bot" },
  { "type": "text", "content": 123 },
  { "type": "text" }
]
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $[0]
    keyword: type
    message: "'You are a helpful bot' is not of type 'object'"
  - path: $[1]
    keyword: required
    message: "'type' is a required property"
  - path: $[2].content
    keyword: type
    message: 123 is not of type 'string'
