# yaml-language-server: $schema=../case.schema.json
description: A bare string and a `tool_call` part in system instructions, which only define `text` and `generic` parts
schema: gen-ai-system-instructions.json
document: [
  "You are a helpful bot",
  { "type": "tool_call", "name": "get_weather" }
]
# Regenerate with `uv run pytest --update-snapshots`, do not edit by hand.
errors:
  - path: $[0]
    keyword: type
    message: "'You are a helpful bot' is not of type 'object'"
  - path: $[1]
    keyword: anyOf
    message: "{'type': 'tool_call', 'name': 'get_weather'} is not valid under any of the given schemas"
