[project]
name = "genai-json-schema-generator"
version = "0.0.0"
description = "Generates the committed GenAI JSON schemas from the pydantic models in models.py"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "jsonschema",
    "pytest",
    "ruamel.yaml",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
