name: Auto-update generated files

# Renovate bumps a pin but doesn't regenerate what derives from it — upstream doc
# links, for example, follow the semantic-conventions tag in model/manifest.yaml.
# CI's generated-docs check would fail, so regenerate here and push the result
# back to the branch instead of leaving `make generate-all` to a maintainer.

on:
  push:
    branches:
      - 'renovate/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Committed outputs that `make generate-all` owns, matching what the
  # generated-docs and reference-status-report CI jobs check.
  GENERATED_PATHS: docs model AGENTS.md reference/README.md reference/reports

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'open-telemetry'
    timeout-minutes: 15
    outputs:
      patch-exists: ${{ steps.create-patch.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared version pins
        id: versions
        uses: ./.github/actions/load-version-pins

      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@f8e1b42fbd1e09df5263c26b7df6011eaafd454d
        with:
          version: '${{ steps.versions.outputs.weaver_version }}'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Regenerate committed outputs
        run: make generate-all

      - id: create-patch
        name: Create patch file
        run: |
          git add -N -- $GENERATED_PATHS
          git diff -- $GENERATED_PATHS > patch
          if [ -s patch ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch file
        if: steps.create-patch.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: patch
          name: patch

  # Separate job so the app private key is never present while regenerating,
  # which runs tooling installed from the versions Renovate just bumped.
  apply:
    runs-on: ubuntu-latest
    needs: generate
    if: needs.generate.outputs.patch-exists == 'true'
    timeout-minutes: 10
    steps:
      - name: Download patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch
          path: ${{ runner.temp }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_SEMANTIC_CONVENTIONS_GENAI_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_SEMANTIC_CONVENTIONS_GENAI_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.otelbot-token.outputs.token }}
          # zizmor: ignore[artipacked] App credentials are required by the push below.
          persist-credentials: true

      - name: Use CLA approved bot
        run: |
          git config user.name otelbot
          git config user.email 197425009+otelbot@users.noreply.github.com

      - name: Apply patch and push
        run: |
          git apply "$RUNNER_TEMP/patch"
          git add -- $GENERATED_PATHS
          git commit -m "Update generated files"
          git push
